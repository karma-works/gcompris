name: Build & Deploy GCompris WASM PWA to GitHub Pages

# Builds the WebAssembly PWA from source in CI and deploys the freshly built
# bundle to GitHub Pages. This is the source of truth for what is deployed --
# the committed pwa/ directory is only a local convenience and is NOT used here,
# so a source fix can no longer ship a stale or mis-generated bundle.
#
# Toolchain is pinned to match the known-good local build:
#   Qt 6.9.1 (host linux_gcc_64 + target wasm_singlethread), emsdk 3.1.70.
# If `cmake` configure ever reports a missing Qt component, add the matching
# aqt module (e.g. qtsensors, qtcharts) to the WASM install step's `modules`.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tools/**'
      - '.github/workflows/deploy-wasm-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  QT_VERSION: 6.9.1
  EM_VERSION: 3.1.70

jobs:
  build:
    name: Build WASM PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build regenerates every asset (RCC packs, .data, voice/word/music
          # packs are re-fetched from the KDE CDN), so the committed LFS blobs in
          # pwa/ are not needed -- skip them to keep the checkout fast.
          lfs: false

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg

      - name: Install Qt host tools (linux_gcc_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          # The cross build resolves several host tool packages via QT_HOST_PATH:
          # lrelease (Qt6LinguistTools, from the qttools archive), qmlcachegen/
          # qmltyperegistrar (qtdeclarative), Quick3DTools (qtquick3d) and the
          # Graphs tooling (qtgraphs). Pin the archive set so qttools is present,
          # and mirror the target's Quick3D/Graphs/shader modules onto the host.
          archives: qtbase qtdeclarative qtsvg qttools qttranslations icu
          modules: qtshadertools qtquick3d qtgraphs
          cache: false
          set-env: false

      - name: Install Qt for WebAssembly (wasm_singlethread)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Qt 6.7+ ships the WebAssembly packages under the all_os/wasm
          # repository, not linux/desktop.
          host: all_os
          target: wasm
          arch: wasm_singlethread
          # Beyond the base wasm package (qtbase/qtdeclarative/qtsvg/qttools),
          # GCompris requires Multimedia, and for Qt >= 6.9 also Graphs and
          # Quick3D (CMakeLists.txt). Quick3D's RuntimeRender pulls in ShaderTools,
          # so qtshadertools is required on the target too. Sensors/Charts/
          # QmlWorkerScript are optional in CMake and intentionally absent.
          modules: qtmultimedia qtgraphs qtquick3d qtshadertools
          cache: false

      - name: Setup emsdk ${{ env.EM_VERSION }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache-${{ env.EM_VERSION }}

      - name: Inspect toolchain (debug)
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          HOST="$QT_ROOT_DIR/../gcc_64"
          echo "Host cmake packages of interest:"
          ls -d "$HOST"/lib/cmake/Qt6LinguistTools "$HOST"/lib/cmake/Qt6Quick3DTools \
                 "$HOST"/lib/cmake/Qt6Graphs 2>&1 || true
          echo "Host lrelease:"; ls -la "$HOST"/bin/lrelease* 2>&1 || true
          echo "WASM Graphs/Quick3D:"; ls -d "$QT_ROOT_DIR"/lib/cmake/Qt6Graphs \
                 "$QT_ROOT_DIR"/lib/cmake/Qt6Quick3D 2>&1 || true

      - name: Configure
        run: |
          # QT_ROOT_DIR is set by the WASM install step (the last install-qt-action
          # with set-env on); the host lives in the sibling gcc_64 directory.
          # Use a normalized (no "..") host path and point at its cmake dir so Qt
          # can resolve the host tool packages (LinguistTools, Quick3DTools,
          # Graphs) across the cross build -- passing QT_HOST_PATH alone is not
          # enough; QT_HOST_PATH_CMAKE_DIR must be set too.
          HOST_QT="$(dirname "$QT_ROOT_DIR")/gcc_64"
          # The wasm package ships qt-cmake without the executable bit, so set it.
          chmod +x "$QT_ROOT_DIR/bin/qt-cmake"
          "$QT_ROOT_DIR/bin/qt-cmake" -G Ninja -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DGCOMPRIS_WASM_PWA=ON \
            -DGCOMPRIS_WASM_DEFAULT_LOCALE=en_US \
            -DQT_HOST_PATH="$HOST_QT" \
            -DQT_HOST_PATH_CMAKE_DIR="$HOST_QT/lib/cmake"

      - name: Build PWA bundle
        run: cmake --build build-wasm --target wasm_pwa_dist -j"$(nproc)"

      - name: Sanity-check the bundle
        run: |
          set -e
          test -f build-wasm/pwa/gcompris-qt.wasm
          test -f build-wasm/pwa/gcompris-qt.data
          test -f build-wasm/pwa/index.html
          # The activity-metadata pack must register under the .../activities
          # prefix or the menu loads empty (the bug this pipeline guards against).
          grep -q "FS.filesystems.IDBFS" build-wasm/pwa/index.html
          ls -la build-wasm/pwa
          ls build-wasm/pwa/share/gcompris-qt/rcc/*.rcc | wc -l

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-wasm/pwa

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
